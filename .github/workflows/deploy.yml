name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - run: yarn install --frozen-lockfile
      - run: yarn validate

      # relative asset URLs: the same build works at
      # https://<user>.github.io/gpx-terrain/ and under any other path
      - name: Deploy dist/ to the gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          branch: gh-pages
          folder: dist
